<!--3.	Function to Find Minimum of Three Numbers
Problem Statement:
•	Create a function min(a, b, c)
•	Return the smallest number
•	Display result
-->



<script>

function min(a, b, c)
{
    var smallest = a;

    if (b < smallest)
    {
        smallest = b;
    }

    if (c < smallest)
    {
        smallest = c;
    }

    return smallest;
}

var result = min(10, 5, 8);
document.write("Smallest number is: " + result);

</script>
