<!--Que 1.Write a JavaScript program to accept two numbers and display their sum,
difference, product, quotient, and remainder.-->

<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
</head>
<body>

<script>

var num1 = parseInt(prompt("Enter first number:"));
var num2 = parseInt(prompt("Enter second number:"));

var sum = num1 + num2;
var sub = num1 - num2;
var mul = num1 * num2;
var div = num1 / num2;
var rem = num1 % num2;

document.write("Sum = " + sum + "<br>");
document.write("Difference = " + sub + "<br>");
document.write("Product = " + mul + "<br>");
document.write("Quotient = " + div + "<br>");
document.write("Remainder = " + rem);

</script>

</body>
</html>
