<!--4.	Function to Calculate Area of Circle
Problem Statement:
•	Create a function area(radius)
•	Calculate area using π × r²
•	Display result
-->

<script>

function area(radius)
{
    var pi = 3.14;
    var result = pi * radius * radius;
    return result;
}

var answer = area(5);
document.write("Area of Circle = " + answer);

</script>
